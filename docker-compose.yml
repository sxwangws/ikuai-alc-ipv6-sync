services:
  ikuai-ipv6-sync:
    image: ikuai-ipv6-sync
    container_name: ikuai-ipv6-sync
    build: .
    restart: always

    # ===== 运行环境（非业务配置）=====
    environment:
      TZ: "Asia/Shanghai"

    # ===== 配置文件挂载 =====
    volumes:
      - ./data:/app/data

    # ===== 日志控制 =====
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ===== 健康检查 =====
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[m]ain.py' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # ===== 网络（可选）=====
    networks:
      - ikuai-sync-net

networks:
  ikuai-sync-net:
    driver: bridge